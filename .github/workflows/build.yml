name: Build ASRClient

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ASRClientCore
        uses: actions/checkout@v4
        with:
          path: ASRClientCore

      - name: Checkout AdbApiWrapper (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: sunayong000/AdbApiWrapper
          path: AdbApiWrapper

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore + Build Release|x86
        working-directory: ASRClientCore
        shell: cmd
        run: msbuild ASRClientCore.sln /t:Restore,Build /p:Configuration=Release /p:Platform=x86 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASRClient-exe
          path: |
            ASRClientCore/bin/Release/
            ASRClientCore/AdbWinApi.dll
